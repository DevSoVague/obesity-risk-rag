# Kubernetes Deployment + ClusterIP Service for the translator microservice.
# Build and push services/translator/Dockerfile to your own registry, then
# replace the image below. Point the app at it with
# TRANSLATOR_URL=http://translator-service:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator
  template:
    metadata:
      labels:
        app: translator
    spec:
      containers:
      - name: translator
        image: REGISTRY/PROJECT/translator:v1
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: translator-service
spec:
  selector:
    app: translator
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
